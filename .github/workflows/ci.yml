name: CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'      
      - '*.md'         
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build

    - name: Compile Code
      run: cmake --build build

    - name: Run Google Test
      run: cd build && ctest --output-on-failure
